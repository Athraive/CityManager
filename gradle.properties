# ==============================
# Project-wide Gradle settings
# ==============================

# JVM Settings (mehr RAM für KSP + Compose)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Gradle Performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# R class optimization
android.nonTransitiveRClass=true

# Compose Performance (empfohlen bei Kotlin 2.x)
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Suppress compileSdk warning (falls du wieder auf 36 gehst)
# android.suppressUnsupportedCompileSdk=36

# Disable Jetifier (nur wenn keine alten Support Libraries genutzt werden)
android.enableJetifier=false
